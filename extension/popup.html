<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Mail Tracker</title>
  <style>
    :root { --g:#1e8e3e; --grey:#5f6368; --bg:#fff; --line:#e8eaed; }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; font: 13px/1.5 'Segoe UI', Roboto, Arial, sans-serif; color:#202124; background:var(--bg); }
    header { display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line); }
    header .ticks { color:var(--g); font-size:18px; font-weight:800; letter-spacing:-2px; }
    header h1 { font-size:14px; margin:0; font-weight:600; }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1px; background:var(--line); }
    .stat { background:#fff; padding:12px 8px; text-align:center; }
    .stat b { display:block; font-size:20px; color:#202124; }
    .stat span { font-size:11px; color:var(--grey); }
    .list { max-height:260px; overflow-y:auto; }
    .row { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .row .subj { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; }
    .row .meta { font-size:11px; color:var(--grey); }
    .mark { font-weight:800; font-size:13px; white-space:nowrap; }
    .m-open { color:var(--g); } .m-sent { color:#9aa0a6; } .m-bounce { color:#d93025; }
    footer { padding:10px 16px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    footer a, footer button { font-size:12px; color:#1a73e8; text-decoration:none; background:none; border:none; cursor:pointer; padding:0; }
    .empty { padding:24px 16px; text-align:center; color:var(--grey); }
    .warn { padding:12px 16px; background:#fef7e0; color:#8a6d00; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <span class="ticks">✓✓</span>
    <h1>My Mail Tracker</h1>
  </header>

  <div id="warn" class="warn" style="display:none">
    Server URL is not set. <a href="#" id="openOpts2">Open settings</a>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><b id="s-sent">–</b><span>Sent</span></div>
    <div class="stat"><b id="s-open">–</b><span>Opened</span></div>
    <div class="stat"><b id="s-click">–</b><span>Clicks</span></div>
  </div>

  <div class="list" id="list"><div class="empty">Loading…</div></div>

  <footer>
    <a href="#" id="openDash">📊 Dashboard</a>
    <button id="openOpts">⚙ Settings</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
